import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.cyanmint.anbox'
    compileSdk 37
    buildToolsVersion '37.0.0'
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId "com.cyanmint.anbox"
        minSdk 23
        //noinspection ExpiredTargetSdkVersion
        targetSdk 28
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'x86_64', 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                targets "anbox", "proot"
                // AGP 9 no longer passes this, so the NDK defaults to the legacy
                // toolchain file which hardcodes CMAKE_SYSTEM_VERSION=1 and breaks
                // the talloc/proot clang target triple (aarch64-linux-android1-clang).
                arguments "-DANDROID_USE_LEGACY_TOOLCHAIN_FILE=false"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.31.5'
        }
    }
    buildFeatures {
        compose true
        aidl true
        buildConfig true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
            excludes += ['/META-INF/LICENSE.md', '/META-INF/NOTICE.md']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.fpliu.ndk.pkg.prefab.android.21:libpng:1.6.37'

    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.compose.material3:material3-window-size-class'
    implementation 'androidx.core:core-pip:1.0.0-alpha03'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Miuix Compose UI
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.3'
    implementation 'top.yukonga.miuix.kmp:miuix-preference:0.9.3'
    implementation 'top.yukonga.miuix.kmp:miuix-icons:0.9.3'
    implementation 'top.yukonga.miuix.kmp:miuix-blur:0.9.3'
    implementation 'top.yukonga.miuix.kmp:miuix-navigation3-ui:0.9.3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation3:navigation3-runtime-android:1.1.4'
    implementation 'io.github.kyant0:backdrop:1.0.6'
    implementation 'sh.calvin.reorderable:reorderable:3.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'androidx.biometric:biometric:1.4.0-alpha07'
    implementation 'androidx.security:security-crypto-ktx:1.1.0'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.conscrypt:conscrypt-android:2.6.1'
    implementation 'com.google.android.material:material:1.14.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'org.apache.commons:commons-compress:1.21'
}
